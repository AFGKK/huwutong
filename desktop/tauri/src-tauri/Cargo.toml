[package]
name = "hwt-license-viewer"
version = "1.0.0"
description = "D-33: 互物通 Tauri 轻量 License 查看器"
authors = ["HWT"]
edition = "2021"

[lib]
name = "hwt_license_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hwt-license-viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
huwutong-sdk = { path = "../../../sdk/tauri" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
