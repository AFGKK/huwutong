name: hwt_license_mobile
description: 互物通 HWT License 移动端管理 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_local_notifications: ^17.0.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  badges: ^3.1.2

  # State
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0

  # Network
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # Auth & Security
  local_auth: ^2.1.8
  flutter_local_auth_invisible: ^1.1.0

  # Push
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.4
  package_info_plus: ^6.0.0
  device_info_plus: ^10.0.1
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app-icon.png"
  adaptive_icon_background: "#1a73e8"
  adaptive_icon_foreground: "assets/icons/app-icon-foreground.png"
