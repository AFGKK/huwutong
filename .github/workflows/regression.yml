# 优化方案 v1 · PR 只读回归（安全 + 门户自助 API）
name: Regression (read-only)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit-regression:
    name: PHPUnit security & portal APIs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hwut_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --shm-size=256m

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, bcmath, sodium, redis
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d hwut_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Migrate
        run: php artisan migrate --force --env=testing
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hwut_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Run read-only regression suite
        run: >
          php artisan test
          --filter="SecurityV6RegressionTest|PortalSelfServiceApiTest|AdminMfaLoginHardeningTest"
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hwut_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
