# D-31: 微信小程序 miniprogram-ci（预览 / 上传体验版）
#
# Secrets（仓库设置）：
#   MP_CI_PRIVATE_KEY  — 代码上传密钥 PEM 全文（换行写成 \n）
#   MP_CI_APPID        — 可选，默认读 miniprogram/project.config.json
#
# 手动触发时可选择 preview 或 upload

name: Miniprogram CI

on:
  push:
    branches: [master, develop]
    paths:
      - 'miniprogram/**'
      - '.github/workflows/miniprogram-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'miniprogram/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'preview=预览码 / upload=上传体验版 / pack=仅校验'
        type: choice
        default: 'preview'
        options:
          - pack
          - preview
          - upload
      version:
        description: '上传版本号（仅 upload）'
        type: string
        default: ''
      desc:
        description: '版本备注'
        type: string
        default: 'CI upload from GitHub Actions'

concurrency:
  group: miniprogram-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Structure + key check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniprogram/package.json

      - name: Install miniprogram-ci
        run: npm install --no-fund --no-audit

      - name: Write private key (optional for pack)
        env:
          MP_CI_PRIVATE_KEY: ${{ secrets.MP_CI_PRIVATE_KEY }}
        run: |
          if [ -n "$MP_CI_PRIVATE_KEY" ]; then
            printf '%b' "$MP_CI_PRIVATE_KEY" > ci/private.key
            chmod 600 ci/private.key
            echo "key written"
          else
            echo "MP_CI_PRIVATE_KEY not set — pack will skip Project init if missing"
          fi

      - name: Pack / validate
        env:
          MP_CI_APPID: ${{ secrets.MP_CI_APPID }}
        run: |
          if [ -f ci/private.key ]; then
            npm run ci:pack
          else
            node -e "const fs=require('fs');['app.json','app.js','project.config.json','pages/index/index.js'].forEach(f=>{if(!fs.existsSync(f))process.exit(1); console.log('ok',f)})"
          fi

  preview:
    name: Preview QR
    needs: pack
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'preview'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniprogram/package.json
      - run: npm install --no-fund --no-audit
      - name: Write private key
        env:
          MP_CI_PRIVATE_KEY: ${{ secrets.MP_CI_PRIVATE_KEY }}
        run: |
          test -n "$MP_CI_PRIVATE_KEY" || (echo "缺少 Secret MP_CI_PRIVATE_KEY" && exit 1)
          printf '%b' "$MP_CI_PRIVATE_KEY" > ci/private.key
          chmod 600 ci/private.key
      - name: Preview
        env:
          MP_CI_APPID: ${{ secrets.MP_CI_APPID }}
          MP_CI_DESC: ${{ github.event.inputs.desc }}
        run: npm run ci:preview
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-preview-qrcode
          path: miniprogram/ci/preview-qrcode.jpg
          if-no-files-found: warn

  upload:
    name: Upload experience build
    needs: pack
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'upload'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniprogram/package.json
      - run: npm install --no-fund --no-audit
      - name: Write private key
        env:
          MP_CI_PRIVATE_KEY: ${{ secrets.MP_CI_PRIVATE_KEY }}
        run: |
          test -n "$MP_CI_PRIVATE_KEY" || (echo "缺少 Secret MP_CI_PRIVATE_KEY" && exit 1)
          printf '%b' "$MP_CI_PRIVATE_KEY" > ci/private.key
          chmod 600 ci/private.key
      - name: Upload
        env:
          MP_CI_APPID: ${{ secrets.MP_CI_APPID }}
          MP_CI_VERSION: ${{ github.event.inputs.version || github.sha }}
          MP_CI_DESC: ${{ github.event.inputs.desc }}
        run: npm run ci:upload
