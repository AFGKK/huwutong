# 互物通生产 HTTPS + Reverb WebSocket 反代（D-02）
# 安装: 复制到 /etc/nginx/sites-available/huwutong 并软链到 sites-enabled
# 证书: certbot certonly --nginx -d 88.huwutong.com
# 替换下方 YOUR_DOMAIN 与证书路径

upstream huwutong_reverb {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name 88.huwutong.com www.huwutong.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 88.huwutong.com www.huwutong.com;

    root /var/www/huwutong/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/88.huwutong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88.huwutong.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 64m;

    # Laravel 主应用
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;

        # 反代 TLS 终止后告知 Laravel 使用 HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
    }

    # Reverb WebSocket（Echo 连接 wss://DOMAIN/app/{key}）
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_pass http://huwutong_reverb;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/huwutong-access.log;
    error_log  /var/log/nginx/huwutong-error.log;
}
