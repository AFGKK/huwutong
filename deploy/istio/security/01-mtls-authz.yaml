# ============================================================
# Istio 安全策略
# M3-68: mTLS 加密通信 + 授权策略
# ============================================================

# ─── 严格 mTLS (全局) ───
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: hwt-mtls-global
  namespace: huwutong
spec:
  mtls:
    mode: STRICT  # 严格要求所有服务间通信使用 mTLS
---
# ─── 允许网关不使用 mTLS (外部流量) ───
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: hwt-mtls-gateway
  namespace: istio-system
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  mtls:
    mode: PERMISSIVE

---
# ─── 授权策略: API 服务访问控制 ───
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hwt-api-authz
  namespace: huwutong
spec:
  selector:
    matchLabels:
      app: hwt-api
  action: ALLOW
  rules:
    # 允许公开端点 (健康检查、状态页)
    - to:
        - operation:
            paths:
              - /health*
              - /api/status*
              - /api/cookie-consent*
    # 允许来自网关的流量
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
      to:
        - operation:
            methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
    # 允许服务间通信
    - from:
        - source:
            namespaces: ["huwutong"]

---
# ─── 授权策略: 管理后台访问限制 ───
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hwt-admin-authz
  namespace: huwutong
spec:
  selector:
    matchLabels:
      app: hwt-admin
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals:
              - "*"
      to:
        - operation:
            ports: ["80"]

---
# ─── 授权策略: Reverb WebSocket 访问限制 ───
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hwt-reverb-authz
  namespace: huwutong
spec:
  selector:
    matchLabels:
      app: hwt-reverb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/huwutong/sa/hwt-api
    - from:
        - source:
            namespaces: ["huwutong"]

---
# ─── 拒绝所有未明确允许的流量 ───
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: hwt-deny-all
  namespace: huwutong
spec:
  action: DENY
  rules:
    - to:
        - operation:
            notPaths:
              - /health*
              - /api/status*
