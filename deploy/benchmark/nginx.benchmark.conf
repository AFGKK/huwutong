# T-24 压测专用 Nginx — 支持 PHP-FPM 和 Octane(Swoole)
# PHP-FPM: upstream hwt_php_fpm (port 9000)
# Octane:  upstream hwt_octane (port 8000)

upstream hwt_backend {
    server app-octane:8000 max_fails=0;
    server app-fpm:9000 backup;
    keepalive 256;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    client_max_body_size 32m;
    keepalive_timeout 65;
    keepalive_requests 10000;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 压测健康端点轻量日志
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Octane 直连（Swoole HTTP 服务）
    location ~ \.php$ {
        proxy_pass http://hwt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_buffering off;
    }

    # 静态资源直接响应
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
