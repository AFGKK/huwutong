# T-24: 压测环境 — Nginx + PHP-FPM / Octane(Swoole) + Redis + PostgreSQL
#
# 用法:
#   # PHP-FPM 模式（默认）
#   docker compose -f deploy/benchmark/docker-compose.benchmark.yml up -d --build
#
#   # Octane(Swoole) 模式（目标 5000 QPS）
#   docker compose -f deploy/benchmark/docker-compose.benchmark.yml --profile octane up -d --build
#
# k6 压测:
#   docker compose -f deploy/benchmark/docker-compose.benchmark.yml --profile k6 run --rm k6-qps

name: hwt-benchmark

x-benchmark-env: &benchmark-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  BENCHMARK_RUNTIME: ${BENCHMARK_RUNTIME:-nginx-php-fpm}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-huwutong}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://127.0.0.1:7700}
  MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-huwutong-dev-master-key}
  OCTANE_SERVER: swoole
  OCTANE_WORKERS: ${OCTANE_WORKERS:-16}
  OCTANE_MAX_REQUESTS: 5000

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hwt-bench-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BENCH_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-huwutong}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - hwt_bench_pg:/var/lib/postgresql/data
    networks:
      - bench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-huwutong}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hwt-bench-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BENCH_REDIS_PORT:-6380}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - bench
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── PHP-FPM 模式（默认，profile: fpm） ───
  app-fpm:
    profiles: [fpm]
    build:
      context: ../..
      dockerfile: deploy/benchmark/Dockerfile.app
    container_name: hwt-bench-app-fpm
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../..:/var/www
    environment:
      <<: *benchmark-env
      BENCHMARK_RUNTIME: nginx-php-fpm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bench

  # ─── Octane(Swoole) 模式（profile: octane，目标 5000 QPS） ───
  app-octane:
    profiles: [octane]
    build:
      context: ../..
      dockerfile: deploy/benchmark/Dockerfile.octane
    container_name: hwt-bench-app-octane
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../..:/var/www
    environment:
      <<: *benchmark-env
      BENCHMARK_RUNTIME: swoole
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bench

  # ─── Nginx（同时代理 PHP-FPM 和 Octane） ───
  nginx:
    image: nginx:1.27-alpine
    container_name: hwt-bench-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BENCH_HTTP_PORT:-8088}:80"
    volumes:
      - ../..:/var/www:ro
      - ./nginx.benchmark.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-fpm
      - app-octane
    networks:
      - bench
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health/live || curl -sf http://127.0.0.1/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ─── 队列（两个模式共用同一个 worker） ───
  queue:
    build:
      context: ../..
      dockerfile: deploy/benchmark/Dockerfile.app
    container_name: hwt-bench-queue
    profiles: [fpm, octane]
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
    volumes:
      - ../..:/var/www
    environment:
      <<: *benchmark-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bench

  # ─── k6 压测 ───
  k6-qps:
    profiles: [k6]
    image: grafana/k6:0.54.0
    container_name: hwt-bench-k6-qps
    working_dir: /bench
    volumes:
      - ../../benchmarks/k6:/bench:ro
      - ../../benchmarks/results:/results:rw
    environment:
      BASE_URL: http://nginx/api
      TARGET_QPS: ${TARGET_QPS:-5000}
      DURATION: ${K6_DURATION:-2m}
      TOKEN: ${BENCHMARK_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - bench
    entrypoint: ["k6", "run", "--summary-export=/results/k6-qps-summary.json", "/bench/scripts/qps-target.js"]

networks:
  bench:
    driver: bridge

volumes:
  hwt_bench_pg:
