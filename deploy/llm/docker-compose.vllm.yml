version: '3.8'

# ===================================================
# vLLM 高性能推理部署 (GPU 推荐)
# M3-49 LocalLLMDeploy
# 使用方式: docker compose -f deploy/llm/docker-compose.vllm.yml up -d
# ===================================================

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: hwt-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - vllm_models:/data/models
      - vllm_home:/home/vllm/.cache
    environment:
      - MODEL_NAME=${VLLM_MODEL:-Qwen/Qwen2-7B-Instruct}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTIL:-0.90}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
      - DTYPE=${DTYPE:-auto}
      - API_KEY=${VLLM_API_KEY:-}
    command:
      - --model
      - /data/models/${VLLM_MODEL:-Qwen/Qwen2-7B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTIL:-0.90}"
      - --dtype
      - "${DTYPE:-auto}"
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

volumes:
  vllm_models:
    driver: local
  vllm_home:
    driver: local
