server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    location /api/mock/ {
        proxy_pass http://host.docker.internal:8000/api/mock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        return 200 '{"status":"ok","server":"huwutong-mock"}';
        add_header Content-Type application/json;
    }
}
