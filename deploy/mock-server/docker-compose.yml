# M1.4-59 API Mock Server — 独立 Docker 部署
# 用于客户集成测试时无需真实 License 即可调试

version: '3.8'

services:
  mock-server:
    image: nginx:alpine
    container_name: huwutong-mock
    ports:
      - "${MOCK_SERVER_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../public:/var/www/public:ro
    networks:
      - huwutong-mock
    restart: unless-stopped

networks:
  huwutong-mock:
    driver: bridge
