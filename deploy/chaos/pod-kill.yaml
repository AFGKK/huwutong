# K8s Pod 随机 Kill 实验
# 验证 Kubernetes 自动恢复能力
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-random-kill
  namespace: chaos-engineering
spec:
  action: pod-kill
  mode: one
  duration: "30s"
  selector:
    namespaces:
      - "default"
    labelSelectors:
      "app": "api"
  scheduler:
    cron: "@every 6h"
