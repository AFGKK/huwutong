# ===================================================
# docker-compose.mysql.yml
# HWT License 离线环境 — MySQL 8.0（遗留栈）
# 使用: docker compose -f docker-compose.mysql.yml up -d
# 新部署请使用 docker-compose.pgsql.yml
# ===================================================
version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: hwt-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-HwtRoot2024!}
      MYSQL_DATABASE: ${DB_DATABASE:-huwutong}
      MYSQL_USER: ${DB_USERNAME:-huwutong}
      MYSQL_PASSWORD: ${DB_PASSWORD:-HwtRoot2024!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
      - --innodb_log_file_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: hwt-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-HwtRedis2024!} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

  api:
    image: hwt-license-api:latest
    container_name: hwt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-huwutong}
      DB_USERNAME: ${DB_USERNAME:-huwutong}
      DB_PASSWORD: ${DB_PASSWORD:-HwtRoot2024!}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-HwtRedis2024!}
      REDIS_PORT: 6379
      BROADCAST_DRIVER: log
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_STORE: file
      SANCTUM_STATEFUL_DOMAINS: ${APP_URL:-localhost:8000}
      SESSION_SECURE_COOKIE: false
    volumes:
      - api_storage:/app/storage
      - api_license:/app/licenses
      - ./config/php.ini:/usr/local/etc/php/conf.d/override.ini:ro
    command: php artisan serve --host=0.0.0.0 --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  queue:
    image: hwt-license-api:latest
    container_name: hwt-queue
    restart: unless-stopped
    depends_on:
      - api
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-huwutong}
      DB_USERNAME: ${DB_USERNAME:-huwutong}
      DB_PASSWORD: ${DB_PASSWORD:-HwtRoot2024!}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-HwtRedis2024!}
      REDIS_PORT: 6379
      BROADCAST_DRIVER: log
      QUEUE_CONNECTION: sync
    volumes:
      - api_storage:/app/storage
      - api_license:/app/licenses
      - ./config/php.ini:/usr/local/etc/php/conf.d/override.ini:ro
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    logging: *default-logging

  nginx:
    image: nginx:1.25-alpine
    container_name: hwt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  api_license:
    driver: local
