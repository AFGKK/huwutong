# ===================================================
# docker-compose.yml
# HWT License 离线环境 Docker Compose
# 默认: PostgreSQL（推荐）— 与生产 huwutong PG 迁移一致
# MySQL 遗留栈: docker-compose.mysql.yml + .env.airgap
# ===================================================
version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-api-db-env: &api-db-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-huwutong}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-HwtRoot2024!}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hwt-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-huwutong}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HwtRoot2024!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/pgsql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-huwutong}"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: hwt-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-HwtRedis2024!} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

  api:
    image: hwt-license-api:latest
    container_name: hwt-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-db-env
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: ${APP_URL:-http://localhost:8000}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-HwtRedis2024!}
      REDIS_PORT: 6379
      BROADCAST_DRIVER: log
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_STORE: file
      SANCTUM_STATEFUL_DOMAINS: ${APP_URL:-localhost:8000}
      SESSION_SECURE_COOKIE: false
      AIR_GAPPED_MODE: "true"
    volumes:
      - api_storage:/app/storage
      - api_license:/app/licenses
      - ./config/php.ini:/usr/local/etc/php/conf.d/override.ini:ro
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force --no-interaction 2>/dev/null || true &&
             php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *default-logging

  queue:
    image: hwt-license-api:latest
    container_name: hwt-queue
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-db-env
      APP_ENV: production
      APP_DEBUG: false
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-HwtRedis2024!}
      REDIS_PORT: 6379
      BROADCAST_DRIVER: log
      QUEUE_CONNECTION: sync
    volumes:
      - api_storage:/app/storage
      - api_license:/app/licenses
      - ./config/php.ini:/usr/local/etc/php/conf.d/override.ini:ro
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    logging: *default-logging

  # ----- Nginx -----
  nginx:
    image: nginx:1.25-alpine
    container_name: hwt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  api_license:
    driver: local
