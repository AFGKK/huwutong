groups:
  # ─── 应用告警 ───
  - name: huwutong_app_alerts
    interval: 30s
    rules:
      - alert: HighHttpErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 错误率超过 5%"
          description: "过去5分钟内，{{ $labels.instance }} 的 HTTP 5xx 错误率达到 {{ $value | humanizePercentage }}"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 响应时间超过 2秒"
          description: "{{ $labels.instance }} 的 P95 响应时间为 {{ $value }}s"

      - alert: HighLicenseValidationFailures
        expr: rate(license_validation_failures_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "License 验证失败率过高"
          description: "过去5分钟 License 验证失败 {{ $value }} 次/秒"

  # ─── 系统告警 ───
  - name: huwutong_system_alerts
    interval: 30s
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率超过 80%"
          description: "{{ $labels.instance }} CPU 使用率 {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率超过 85%"
          description: "{{ $labels.instance }} 内存使用率 {{ $value }}%"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "磁盘剩余空间不足 10%"
          description: "{{ $labels.instance }} 磁盘剩余 {{ $value | humanizePercentage }}"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "实例 {{ $labels.instance }} 宕机"
          description: "{{ $labels.instance }} 已宕机超过 1 分钟"

  # ─── 数据库告警 ───
  - name: huwutong_database_alerts
    interval: 30s
    rules:
      - alert: MysqlConnectionHigh
        expr: mysql_global_status_threads_connected > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 连接数超过 100"
          description: "当前连接数 {{ $value }}"

      - alert: MysqlSlowQueries
        expr: rate(mysql_global_status_slow_queries[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 慢查询过多"
          description: "慢查询速率 {{ $value }} 次/秒"

  # ─── Redis 告警 ───
  - name: huwutong_redis_alerts
    interval: 30s
    rules:
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用率超过 80%"
          description: "当前使用率 {{ $value | humanizePercentage }}"

  # ─── 队列告警 ───
  - name: huwutong_queue_alerts
    interval: 30s
    rules:
      - alert: QueueTooManyFailedJobs
        expr: horizon_failed_jobs_total > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Horizon 失败 Job 超过 50 个"
          description: "当前失败 Job 数 {{ $value }}"
