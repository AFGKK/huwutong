# D-01 / D-02: 队列 Worker 进程守护
# 安装: 复制到 /etc/supervisor/conf.d/huwutong-worker.conf
# 注意: numprocs 根据 CPU 核心数调整

[program:huwutong-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/huwutong/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/huwutong-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopwaitsecs=600
