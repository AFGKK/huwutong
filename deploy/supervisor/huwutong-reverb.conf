# D-01: Supervisor — Laravel Reverb WebSocket 进程守护
# 安装: 复制到 /etc/supervisor/conf.d/huwutong-reverb.conf
# 重载: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start huwutong-reverb

[program:huwutong-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/huwutong/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/huwutong-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=7
stopwaitsecs=300
