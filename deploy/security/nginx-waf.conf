# ─── Nginx WAF 配置 ───
# M1.3-18 WAF 基础防护 - Nginx 层规则
# 部署到 /etc/nginx/conf.d/waf.conf

# 禁止危险的 HTTP 方法
if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
}

# 阻止常见扫描工具 User-Agent
map $http_user_agent $bad_ua {
    default 0;
    ~*(sqlmap|nmap|nikto|acunetix|nessus|openvas|burpsuite|gobuster|dirbuster|wfuzz|hydra|medusa|zmap|masscan) 1;
}

# 阻止空 User-Agent（非 API 健康检查）
map $request_uri $skip_empty_ua_check {
    default 0;
    ~*/health 1;
    ~*/up 1;
}

if ($bad_ua = 1) {
    return 403;
}

# 请求体大小限制
client_max_body_size 1M;
client_body_buffer_size 128k;

# 超时设置
client_body_timeout 12s;
client_header_timeout 12s;
send_timeout 10s;

# 限制连接数（同一 IP）
limit_conn_zone $binary_remote_addr zone=waf_conn:10m;
limit_conn waf_conn 50;

# 限制请求速率（同一 IP）
limit_req_zone $binary_remote_addr zone=waf_req:10m rate=300r/m;
limit_req zone=waf_req burst=20 nodelay;
