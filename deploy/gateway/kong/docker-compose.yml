# ─── Kong API Gateway Docker Compose ───
# M1.3-20 API 网关统一层
# 用法: docker compose -f deploy/gateway/kong/docker-compose.yml up -d

version: '3.8'

services:
  # Kong 数据库 (PostgreSQL)
  kong-database:
    image: postgres:15-alpine
    container_name: huwutong-kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kong-data:/var/lib/postgresql/data
    networks:
      - huwutong-network

  # Kong 数据库迁移
  kong-migration:
    image: kong:3.8
    container_name: huwutong-kong-migrate
    command: "kong migrations bootstrap"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - huwutong-network

  # Kong API Gateway
  kong:
    image: kong:3.8
    container_name: huwutong-kong
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_PLUGINS: "bundled,rate-limiting,cors,prometheus,ip-restriction,request-size-limiting,acl,jwt,oauth2"
    ports:
      - "8000:8000"   # 代理端口 (HTTP)
      - "8443:8443"   # 代理端口 (HTTPS)
      - "8001:8001"   # 管理 API
      - "8002:8002"   # Kong Manager UI
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - huwutong-network

  # Konga (开源 Kong 管理界面)
  konga:
    image: pantsel/konga:latest
    container_name: huwutong-konga
    environment:
      NODE_ENV: production
      TOKEN_SECRET: huwutong-konga-secret
    ports:
      - "1337:1337"
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - huwutong-network

networks:
  huwutong-network:
    driver: bridge

volumes:
  kong-data:
