# ─── Kong API Gateway 声明式配置 ───
# M1.3-20 API 网关统一层
# 部署: kong config db_import /path/to/declarative.yml
# 或通过 Kong Manager / Admin API 导入

_format_version: "3.0"
_transform: true

# ─── 全局插件 ───

# 全局限流
plugins:
  - name: rate-limiting
    config:
      minute: 600
      hour: 30000
      day: 500000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
      redis:
        host: redis
        port: 6379
        database: 2
        timeout: 2000

  # CORS
  - name: cors
    config:
      origins:
        - "*"
      methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      headers: "Content-Type,Authorization,X-Requested-With,X-API-Key,X-Signature,X-Nonce,X-Timestamp"
      exposed_headers: "X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset"
      credentials: false
      max_age: 3600
      preflight_continue: false

  # Prometheus 监控
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # 请求体大小限制
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      require_content_length: false

  # IP 黑白名单
  - name: ip-restriction
    config:
      deny: []
      allow: []
      message: "请求被拒绝：IP 不在白名单或已在黑名单中"

# ─── Upstream ───
upstreams:
  - name: huwutong-api-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        concurrency: 10
        healthy:
          interval: 30
          successes: 3
        unhealthy:
          interval: 5
          failures: 5
          http_failures: 3
      passive:
        type: http
        healthy:
          successes: 5
        unhealthy:
          failures: 3
          http_failures: 3
          timeouts: 3
    targets:
      - target: host.docker.internal:8000
        weight: 100

# ─── Service ───
services:
  - name: huwutong-api
    host: host.docker.internal
    port: 8000
    protocol: http
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3

    routes:
      # API v1 路由组
      - name: hwt-api-v1
        paths:
          - /api/v1
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 0
        protocols:
          - http
          - https

      # License 激活路由（特殊限流）
      - name: hwt-activate
        paths:
          - /api/v1/license/activate
          - /api/v1/license/validate
        methods:
          - POST
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              hour: 3000
              policy: local

      # 认证路由（严格限流）
      - name: hwt-auth
        paths:
          - /api/v1/auth
          - /api/v1/login
          - /api/v1/register
        methods:
          - POST
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 20
              hour: 500
              policy: local

      # 健康检查（无限制）
      - name: hwt-health
        paths:
          - /api/v1/health
          - /health
          - /up
        methods:
          - GET
          - HEAD
        strip_path: true
        plugins:
          - name: rate-limiting
            config:
              minute: 1000
              hour: 60000
              policy: local

# ─── Consumer（API 消费者） ───
consumers: []
