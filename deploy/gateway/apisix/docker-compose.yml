# ─── APISIX API Gateway Docker Compose ───
# M1.3-20 API 网关统一层
# 用法: docker compose -f deploy/gateway/apisix/docker-compose.yml up -d

version: '3.8'

services:
  # ETCD (APISIX 配置存储)
  etcd:
    image: bitnami/etcd:3.5
    container_name: huwutong-apisix-etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      - huwutong-network

  # APISIX API Gateway
  apisix:
    image: apache/apisix:3.9
    container_name: huwutong-apisix
    depends_on:
      - etcd
    environment:
      APISIX_STAND_ALONE: "false"
    ports:
      - "9080:9080"   # 代理端口 (HTTP)
      - "9443:9443"   # 代理端口 (HTTPS)
      - "9180:9180"   # 管理 API
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/apisix/admin/routes"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - huwutong-network

  # APISIX Dashboard (可视化管理面板)
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0
    container_name: huwutong-apisix-dashboard
    depends_on:
      - apisix
    ports:
      - "9090:9090"
    networks:
      - huwutong-network

networks:
  huwutong-network:
    driver: bridge

volumes:
  etcd-data:
