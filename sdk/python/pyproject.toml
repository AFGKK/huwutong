[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huwutong-sdk"
version = "1.0.0"
description = "HWT License 官方 Python SDK - License 激活/验证/设备管理"
readme = "README.md"
authors = [
    {name = "Huwutong Team", email = "dev@huwutong.com"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/huwutong/huwutong-sdk-python"
Documentation = "https://developers.huwutong.com"
Source = "https://github.com/huwutong/huwutong-sdk-python"
