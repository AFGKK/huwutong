[package]
name = "huwutong-sdk"
version = "1.0.0"
description = "HWT License SDK for Tauri/Rust - M2-21"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "1.0"

[lib]
name = "huwutong_sdk"
path = "src/lib.rs"
